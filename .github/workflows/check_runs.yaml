name: Process Check Runs
on:
    check_run:
        types: [completed]
env:
  CHECK_RUN_HANDLER_ACTION_PATH: ./.github/actions/check_run_handler
  REQUIRED_BRANCH_PREFIXES: "gh-readonly-queue/,cicd_mq_test/"
jobs:
    process_check_runs:
        runs-on: ubuntu-latest
        steps:
          - name: Checkout code
            uses: actions/checkout@v5
            with:
              ref: ${{ github.event.check_run.head_sha }}

          - name: Check Branch Prefix
            id: check_branch
            run: |
              HEAD_BRANCH="${{ github.event.check_run.check_suite.head_branch }}"
              REQUIRED_PREFIXES="$REQUIRED_BRANCH_PREFIXES"
              
              echo "Target branch: $HEAD_BRANCH"
              echo "Required prefixes: $REQUIRED_PREFIXES"
              
              # Convert comma-separated string to array
              IFS=',' read -ra PREFIX_ARRAY <<< "$REQUIRED_PREFIXES"
              
              # Check if branch starts with any of the required prefixes
              BRANCH_VALID=false
              MATCHED_PREFIX=""
              
              for prefix in "${PREFIX_ARRAY[@]}"; do
                # Trim whitespace
                prefix=$(echo "$prefix" | xargs)
                if [[ "$HEAD_BRANCH" == "$prefix"* ]]; then
                  BRANCH_VALID=true
                  MATCHED_PREFIX="$prefix"
                  break
                fi
              done
              
              if [ "$BRANCH_VALID" = true ]; then
                echo "✅ Branch '$HEAD_BRANCH' has a valid prefix: '$MATCHED_PREFIX'"
                echo "branch_prefix_valid=true" >> $GITHUB_OUTPUT
                echo "matched_prefix=$MATCHED_PREFIX" >> $GITHUB_OUTPUT
              else
                echo "❌ Branch '$HEAD_BRANCH' does not match any required prefixes: $REQUIRED_PREFIXES"
                echo "branch_prefix_valid=false" >> $GITHUB_OUTPUT
              fi

          - name: Prepare Check Run Context
            id: prepare
            if: steps.check_branch.outputs.branch_prefix_valid == 'true'
            # Use the built-in toJSON function to convert the object to a string
            run: |
                #Checks if the composite action exists and prepares the check_run JSON string

                # 1. Define a unique delimiter (e.g., EOF or a custom string)
                DELIMITER=$(uuidgen)

                # 2. Start the output command with the variable name and the delimiter
                echo "check_run_json<<$DELIMITER" >> $GITHUB_OUTPUT

                # 3. Print the multi-line JSON content
                # The 'toJSON' function ensures the output is a single JSON string,
                # but the string itself will be multi-line (pretty-printed) if complex.
                echo '${{ toJSON(github.event.check_run) }}' >> $GITHUB_OUTPUT

                # 4. End the output with the delimiter on its own line
                echo "$DELIMITER" >> $GITHUB_OUTPUT

                # 5. Check if the composite action directory exists
                CHECK_RUN_HANDLER_ACTION_PATH="$CHECK_RUN_HANDLER_ACTION_PATH"

                if [ -d "$CHECK_RUN_HANDLER_ACTION_PATH" ]; then
                  echo "Composite action found at $CHECK_RUN_HANDLER_ACTION_PATH."
                  echo "check_run_handler_exists=true" >> $GITHUB_OUTPUT
                else
                  echo "🚨 Composite action NOT found at $CHECK_RUN_HANDLER_ACTION_PATH. Skipping execution."
                  echo "check_run_handler_exists=false" >> $GITHUB_OUTPUT
                fi
          - name: Process current check_run
            if: steps.check_branch.outputs.branch_prefix_valid == 'true' && steps.prepare.outputs.check_run_handler_exists == 'true'
            # 2. Pass the JSON string output to the composite action's input
            uses: ./.github/actions/check_run_handler
            with:
              check-run-data: ${{ steps.prepare.outputs.check_run_json }}