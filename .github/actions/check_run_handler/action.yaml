#composite action
name: 'Check Run Handler'
description: 'Handles check run events and performs actions based on check run names'
# inputs:
#   github_token:
#       description: 'GitHub Token for authentication'
#       required: true
runs:
    using: "composite"
    steps:
        - name: Print Check Run Name
          shell: bash
          run: |
            echo "Starting Check Run Handler Action new version..."
            # 3. Use 'jq' to parse the JSON string and extract specific fields
            CHECK_NAME=$(echo "$CHECK_RUN_DATA" | jq -r '.name')
            CONCLUSION=$(echo "$CHECK_RUN_DATA" | jq -r '.conclusion')
            HEAD_SHA=$(echo "$CHECK_RUN_DATA" | jq -r '.head_sha')
            
            echo "--- Check Run Details ---"
            echo "Name: $CHECK_NAME"
            echo "Conclusion: $CONCLUSION"
            echo "Head SHA: $HEAD_SHA"
            echo "-------------------------"
        - name: Test GitHub Token
          shell: bash
          run: |
            echo "Testing GitHub Token... ${GITHUB_TOKEN:0:6}****"
            curl -s -H "Authorization: token $GITHUB_TOKEN" \
                -H "Accept: application/vnd.github.v3+json" \
                "https://api.github.com/repos/${GITHUB_REPOSITORY}"
